name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build & Release
        env:
          # 需要在 GitHub Repository Settings -> Secrets 中設定 GH_TOKEN
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm run build

      # 若需要簽名（Windows Code Signing / macOS Notarization），需在此加入相關步驟與 Secrets
