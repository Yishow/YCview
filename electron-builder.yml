appId: com.ycview.app
productName: YCview
copyright: Copyright © 2025

directories:
  output: release
  buildResources: resources

files:
  - dist/**/*
  - electron/**/*
  - package.json
  - '!**/.git'
  - '!**/node_modules/*/{CHANGELOG.md,README.md}'
  - '!**/*.{ts,tsx}'
  - '!src/**'

# Windows Configuration
win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icons/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

# macOS Configuration
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  icon: resources/icons/icon.icns
  category: public.app-category.utilities

# Linux Configuration
linux:
  target:
    - target: AppImage
      arch: [x64]
  icon: resources/icons
  category: Utility
